[tool.poetry]
name = "orbweaver-tools"
version = "1.3.1"
description = "Stealth-oriented utilities for web scraping with rotating user agents, proxies, and Selenium helpers."
authors = ["Tom Freeman"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Tom3man/orb-weaver"
repository = "https://github.com/Tom3man/orb-weaver"
keywords = ["web-scraping", "selenium", "proxies", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
packages = [{ include = "orb" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
bs4 = "^0.0.1"
pandas = "^2.1.4"
requests = "^2.31.0"
selenium = "^4.16.0"
webdriver-manager = "^4.0.1"
fake-useragent = "^1.4.0"
python-dotenv = { version = "^1.0.1", optional = true }

[tool.poetry.extras]
selenium = ["selenium", "webdriver-manager"]
scraping = ["bs4", "pandas"]
env = ["python-dotenv"]
all = ["selenium", "webdriver-manager", "bs4", "pandas", "python-dotenv"]

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
ruff = "^0.9.7"
mypy = "^1.15.0"
pre-commit = "^4.1.0"
bandit = "^1.8.3"
pip-audit = "^2.8.0"
types-requests = "^2.32.0.20250328"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.20"

[tool.poetry.scripts]
orb = "orb.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=orb --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "orb/common/design/welcome_page.py",
    "orb/common/vpn/pia.py",
    "orb/spinner/utils.py",
    "orb/utils/decorators.py",
    "tests/orb/common/proxies/test_test_proxies.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["orb/cli.py", "orb/config.py", "orb/logging_utils.py", "orb/net.py", "orb/scraper/utils.py"]

[tool.bandit]
exclude_dirs = ["tests", "orb/common/vpn", "orb/common/design", "orb/spinner"]
skips = ["B311", "B404", "B603"]
